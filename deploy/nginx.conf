# Same-origin frontend (build:app): SPA at /, API proxied at /api/.
# Serve frontend/dist as /usr/share/nginx/html so / and /explore etc. return index.html.
# No CORS needed; browser and API share the same origin.
server {
  listen 80;
  server_name _;

  location /api/ {
    proxy_pass http://nba-stat-spot-backend:8007;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Player stats can be slow on cold cache (NBA API); allow up to 5 min
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
  }

  # SPA fallback: non-API paths serve index.html for client-side routing
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}

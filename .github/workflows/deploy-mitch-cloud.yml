name: Deploy to mitch-cloud

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/**'
      - 'docker-compose.prod.yml'
      - 'Dockerfile.backend'
      - 'Dockerfile.frontend'
      - '.github/workflows/deploy-mitch-cloud.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy app to mitch-cloud
    runs-on: ubuntu-latest
    # Only deploy on merge to main or manual dispatch
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    env:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      
      - name: Add server to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
      
      - name: Deploy to mitch-cloud
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -e
          
          # Create directory structure if it doesn't exist
          ssh ${VPS_USER}@${VPS_HOST} << 'EOF'
            set -e
            mkdir -p /opt/360ws/clients/docker-app/nba-stat-spot
            mkdir -p /data/databases/nba-stat-spot
            mkdir -p /data/nba-stat-spot/logs
            mkdir -p /data/nba-stat-spot/redis
          EOF
          
          # Copy files to server (do not delete .env / local overlays)
          rsync -avz \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '.venv' \
            --exclude 'frontend/dist' \
            --exclude '.env' \
            ./ ${VPS_USER}@${VPS_HOST}:/opt/360ws/clients/docker-app/nba-stat-spot/
          
          # SSH into the server and deploy
          ssh ${VPS_USER}@${VPS_HOST} << 'EOF'
            set -e
            cd /opt/360ws/clients/docker-app/nba-stat-spot
            
            # Ensure 360ws-network exists
            docker network create 360ws-network 2>/dev/null || true
            
            # Build images (use cache; avoid destructive compose down which
            # recreates postgres and can corrupt WAL on abrupt stop)
            docker compose -f docker-compose.prod.yml build
            
            # Rolling recreate of app containers only — leave postgres/redis running
            docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate backend pipeline frontend
            docker compose -f docker-compose.prod.yml up -d postgres redis
            
            # Wait for services to be healthy
            echo "Waiting for services to be healthy..."
            sleep 10
            
            # Run database migrations
            echo "Running database migrations..."
            docker compose -f docker-compose.prod.yml exec -T backend alembic upgrade head || \
            docker compose -f docker-compose.prod.yml run --rm backend alembic upgrade head || true
            
            # Health check
            echo "Performing health check..."
            max_attempts=30
            attempt=0
            while [ $attempt -lt $max_attempts ]; do
              if curl -f http://localhost:8007/healthz > /dev/null 2>&1; then
                echo "Health check passed!"
                break
              fi
              attempt=$((attempt + 1))
              echo "Health check attempt $attempt/$max_attempts failed, retrying..."
              sleep 2
            done
            
            if [ $attempt -eq $max_attempts ]; then
              echo "Health check failed after $max_attempts attempts."
              docker compose -f docker-compose.prod.yml logs --tail=80 backend postgres
              exit 1
            fi
            
            # Quick API smoke
            curl -sf "http://localhost:8007/api/v1/players/search?q=lebron" > /dev/null
            echo "Deployment successful!"
          EOF
      
      - name: Notify Slack on success
        if: success() && env.SLACK_WEBHOOK != ''
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"✅ NBA-Stat-Spot deployed successfully to mitch-cloud\"}" \
            "$SLACK_WEBHOOK"
      
      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK != ''
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"❌ NBA-Stat-Spot deployment to mitch-cloud failed\"}" \
            "$SLACK_WEBHOOK"

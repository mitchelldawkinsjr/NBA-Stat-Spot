name: Deploy to Fly.io

# DEPRECATED: This workflow is disabled. The application has been migrated to mitch-cloud.
# See: docs/mitch-cloud-deployment.md
# To re-enable, remove the 'if: false' condition below.

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - 'fly.toml'
      - 'Dockerfile'
      - 'Dockerfile.backend'
      - '.github/workflows/deploy-fly.yml'
  workflow_dispatch:

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  deploy:
    name: Deploy app to Fly.io
    runs-on: ubuntu-latest
    # DEPRECATED: Disabled - application migrated to mitch-cloud
    if: false
    steps:
      - uses: actions/checkout@v4
      
      - uses: superfly/flyctl-actions/setup-flyctl@master
      
      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}


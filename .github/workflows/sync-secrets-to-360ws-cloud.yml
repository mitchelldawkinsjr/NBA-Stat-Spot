name: Sync secrets to 360-Web-Solutions-Cloud

# Copies deployment secrets from this repo into mitchelldawkinsjr/360-Web-Solutions-Cloud.
# Requires a classic PAT with repo scope on the target repo, stored here as SYNC_360WS_GH_PAT.

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Validate sync token
        env:
          SYNC_360WS_GH_PAT: ${{ secrets.SYNC_360WS_GH_PAT }}
        run: |
          if [ -z "$SYNC_360WS_GH_PAT" ]; then
            echo "::error::Add SYNC_360WS_GH_PAT (classic PAT with repo scope on 360-Web-Solutions-Cloud) to this repo, or set secrets manually with gh secret set."
            exit 1
          fi

      - name: Copy secrets to 360-Web-Solutions-Cloud
        env:
          GH_TOKEN: ${{ secrets.SYNC_360WS_GH_PAT }}
          TARGET_REPO: mitchelldawkinsjr/360-Web-Solutions-Cloud
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          set -e
          # Use IP if VPS_HOST is a non-resolving hostname (e.g. "vps")
          HOST="$VPS_HOST"
          if ! getent hosts "$HOST" >/dev/null 2>&1; then
            echo "VPS_HOST '$HOST' does not resolve; using 82.25.91.63"
            HOST="82.25.91.63"
          fi
          printf '%s' "$HOST" | gh secret set VPS_HOST --repo "$TARGET_REPO"
          printf '%s' "$VPS_USER" | gh secret set VPS_USER --repo "$TARGET_REPO"
          printf '%s' "$VPS_SSH_KEY" | gh secret set VPS_SSH_KEY --repo "$TARGET_REPO"
          if [ -n "$SLACK_WEBHOOK" ]; then
            printf '%s' "$SLACK_WEBHOOK" | gh secret set SLACK_WEBHOOK --repo "$TARGET_REPO"
          fi
          echo "Secrets synced to $TARGET_REPO"
